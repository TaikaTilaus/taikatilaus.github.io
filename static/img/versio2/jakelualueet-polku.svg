<svg xmlns="http://www.w3.org/2000/svg" width="960" height="180" viewBox="0 0 960 180" role="img" aria-labelledby="title desc">
  <title id="title">Jakelualueiden valikkopolku</title>
  <desc id="desc">Postitus → Postitusasetukset → Jakelualueet. Välilehti näkyy vain, kun aluehinnoittelu on käytössä.</desc>
  <rect width="960" height="180" rx="12" fill="#f4f7fb"/>
  <g font-family="Arial, sans-serif" font-size="24" text-anchor="middle">
    <rect x="24" y="28" width="220" height="62" rx="8" fill="#0a285f"/>
    <text x="134" y="67" fill="white">Postitus</text>
    <text x="275" y="67" fill="#0a285f">→</text>
    <rect x="306" y="28" width="310" height="62" rx="8" fill="#0a285f"/>
    <text x="461" y="67" fill="white">Postitusasetukset</text>
    <text x="647" y="67" fill="#0a285f">→</text>
    <rect x="678" y="28" width="258" height="62" rx="8" fill="#0a285f"/>
    <text x="807" y="67" fill="white">Jakelualueet</text>
    <text x="480" y="139" font-size="21" fill="#24344d">Välilehti näkyy vain, kun aluehinnoittelu on käytössä.</text>
  </g>
</svg>
